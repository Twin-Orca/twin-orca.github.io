<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Twin Orca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
<style>
:root{--abyss:#0B2537;--tide:#0A7C84;--lagoon:#2BB7AE;--foam:#F2F7F7;--sand:#F2C14E;--mist:#7D95A1}
*{box-sizing:border-box}
body{margin:0;background:var(--foam);color:var(--abyss);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}
h1,h2{font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:600;letter-spacing:.5px}
h1{font-size:2rem;margin:0}
h2{font-size:1.2rem;margin:2rem 0 .4rem}
.wave{height:8px;margin:12px 0 24px;background:repeating-linear-gradient(90deg,var(--lagoon) 0 8px,transparent 8px 16px),repeating-linear-gradient(90deg,transparent 0 8px,var(--lagoon) 8px 16px);background-size:100% 4px;background-position:0 0,0 4px;background-repeat:no-repeat}
.box{background:#fff;border:2px solid var(--abyss);box-shadow:4px 4px 0 var(--abyss);padding:16px 20px;margin:16px 0}
.meta{color:var(--mist)}
a{color:var(--tide);font-weight:600}
</style></head>
<body><main><h1>Twin Orca</h1><p class="meta">Small, private, offline-first apps.</p><div class="wave"></div>
<div class="box"><h2 style="margin-top:0">Sea Spends</h2><p>A private, offline income and expense log for Android. <a href="sea-spends/privacy.html">Privacy policy</a></p></div>
<p>Contact: <a href="mailto:twinorca.apps@gmail.com">twinorca.apps@gmail.com</a></p></main></body></html>
